# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: security-service
# Perfil:   prod (Producción / Docker Compose unificado)
# Puerto:   8083
# ==============================================================================

server:
  port: 8083
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: security-service
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-security}:${DB_PORT:3306}/${DB_NAME:security_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:security_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:${SECURITY_JWT_PRIVATE_KEY}}
    expiration: ${SECURITY_JWT_EXPIRATION:3600000}
    issuer: ${SECURITY_JWT_ISSUER:logitrack-security}

logging:
  level:
    root: WARN
    lazyHawk.security_service: INFO
    org.springframework.security: WARN
    org.springframework: WARN
    org.hibernate: ERROR

# --- EUREKA CLIENT ---
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true # <-- AGREGADO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-server:9411/api/v2/spans}