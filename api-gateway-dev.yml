# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: api-gateway
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8066
# ==============================================================================

server:
  port: 8066

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:${SECURITY_JWT_PRIVATE_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration: ${SECURITY_JWT_EXPIRATION:3600000}
    issuer: ${SECURITY_JWT_ISSUER:logitrack-security}
    jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8082/realms/lazyhawk/protocol/openid-connect/certs}

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8082}
  fallback-url: ${KEYCLOAK_FALLBACK_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:lazyhawk}
  client-id: ${KEYCLOAK_CLIENT_ID:logitrack-frontend}
  admin:
    user: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8065/eureka/}

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: keycloak-login
          uri: ${KEYCLOAK_URI:http://keycloak:8080}
          predicates:
            - Path=/api/auth/login
          filters:
            - SetPath=/realms/lazyhawk/protocol/openid-connect/token
        - id: keycloak-service
          uri: ${KEYCLOAK_URI:http://keycloak:8080}
          predicates:
            - Path=/realms/**, /resources/**
        - id: courier-service
          uri: lb://COURIER-SERVICE
          predicates:
            - Path=/api/v1/repartidores/**
        - id: shipment-service-envios
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/v1/envios/**
        - id: shipment-service-clientes
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/v1/clientes/**
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: keycloak-login
              uri: ${KEYCLOAK_URI:http://keycloak:8080}
              predicates:
                - Path=/api/auth/login
              filters:
                - SetPath=/realms/lazyhawk/protocol/openid-connect/token
            - id: keycloak-service
              uri: ${KEYCLOAK_URI:http://keycloak:8080}
              predicates:
                - Path=/realms/**, /resources/**
            - id: courier-service
              uri: lb://COURIER-SERVICE
              predicates:
                - Path=/api/v1/repartidores/**
            - id: shipment-service-envios
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/api/v1/envios/**
            - id: shipment-service-clientes
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/api/v1/clientes/**

management:
  endpoint:
    gateway:
      enabled: true
    prometheus:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
