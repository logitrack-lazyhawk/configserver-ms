# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: shipment-service
# Perfil:   prod (Producción / Docker Compose unificado)
# Puerto:   8080
# ==============================================================================

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          courier-service:
            connectTimeout: 2000
            readTimeout: 3000
      micrometer:
        enabled: true
  application:
    name: shipment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-shipment}:${DB_PORT:3306}/${DB_NAME:shipment_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:shipment_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: WARN
    com.logitrack.shipmentservice: INFO
    org.springframework: WARN
    org.hibernate: ERROR

# --- EUREKA CLIENT ---
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true # <-- AGREGADO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-server:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - java.lang.IllegalArgumentException
          - com.logitrack.shipmentservice.dominio.exception.ReglaNegocioException
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 6s
