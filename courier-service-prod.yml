# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: courier-service
# Perfil:   prod (Producción / Docker Compose unificado)
# Puerto:   8081
# ==============================================================================

server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: courier-service

  # ----------------------------------------------------------------------------
  # PERSISTENCIA Y BASE DE DATOS (MySQL en contenedor Docker)
  # ----------------------------------------------------------------------------
  datasource:
    # Nombre DNS del servicio Docker MySQL de repartidores
    url: jdbc:mysql://${DB_HOST:mysql-courier}:${DB_PORT:3306}/${DB_NAME:courier_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:courier_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect


# ------------------------------------------------------------------------------
# OBSERVABILIDAD Y ACTUATOR
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ------------------------------------------------------------------------------
# DOCUMENTACIÓN DE APIS (OpenAPI / Swagger)
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ------------------------------------------------------------------------------
# LOGGING (Producción)
# ------------------------------------------------------------------------------
logging:
  level:
    root: WARN
    com.logitrack.curier_service: INFO
    org.springframework: WARN
    org.hibernate: ERROR
