# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: courier-service
# Perfil:   prod (Producción / Docker Compose unificado)
# Puerto:   8081
# ==============================================================================

server:
  port: 8081
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: courier-service
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-courier}:${DB_PORT:3306}/${DB_NAME:courier_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:courier_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: WARN
    com.logitrack.courier_service: INFO
    org.springframework: WARN
    org.hibernate: ERROR

# --- EUREKA CLIENT ---
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true # <-- AGREGADO

app:
  normalizacion:
    telefono:
      codigo-pais: "54"
      prefijo-internacional: "+54"
      prefijo-movil: "+549"
      prefijo-interurbano: "0"
      prefijo-movil-local: "15"
      area-amba: "11"
      prefijo-amba-con-quince: "1115"
      regex-limpieza: "[.\\-\\s()]"
    dni:
      regex-limpieza: "[.\\-\\s]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-server:9411/api/v2/spans}