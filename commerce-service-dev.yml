# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: commerce-service
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8084
# ==============================================================================

server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: commerce-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:commerce_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Pio02112001}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

# ------------------------------------------------------------------------------
# EUREKA CLIENT
# ------------------------------------------------------------------------------
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8065/eureka/
  instance:
    prefer-ip-address: true

# ------------------------------------------------------------------------------
# OBSERVABILIDAD Y ACTUATOR (Spring Cloud Sleuth + Zipkin)
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    brave:
      span-joining-supported: true
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

# ------------------------------------------------------------------------------
# DOCUMENTACIÓN DE APIS (OpenAPI / Swagger)
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.logitrack.commerceservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE