# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: courier-service
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8081
# ==============================================================================

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: courier-service

  # ----------------------------------------------------------------------------
  # PERSISTENCIA Y BASE DE DATOS (MySQL - courier_db)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:courier_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


# ------------------------------------------------------------------------------
# OBSERVABILIDAD Y ACTUATOR
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ------------------------------------------------------------------------------
# DOCUMENTACIÓN DE APIS (OpenAPI / Swagger)
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

# ------------------------------------------------------------------------------
# LOGGING (Diagnóstico para com.logitrack.curier_service)
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.logitrack.curier_service: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
