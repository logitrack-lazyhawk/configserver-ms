# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: api-gateway
# Perfil:   prod (Producción / Docker Compose)
# Puerto:   8066
# ==============================================================================

server:
  port: 8066

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:${SECURITY_JWT_PRIVATE_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration: ${SECURITY_JWT_EXPIRATION:3600000}
    issuer: ${SECURITY_JWT_ISSUER:logitrack-security}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8065/eureka/}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: security-service
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: courier-service
          uri: lb://COURIER-SERVICE
          predicates:
            - Path=/api/v1/repartidores/**

        - id: shipment-service-envios
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/v1/envios/**

        - id: shipment-service-clientes
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/v1/clientes/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

