# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: shipment-service
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8080
# ==============================================================================

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: shipment-service

  # ----------------------------------------------------------------------------
  # PERSISTENCIA Y BASE DE DATOS (MySQL - shipment_db)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shipment_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# COMUNICACIÓN INTER-SERVICIO (REST hacia courier-service)
# ------------------------------------------------------------------------------
app:
  services:
    courier:
      # En dev apunta al puerto expuesto en localhost
      url: ${COURIER_SERVICE_URL:http://localhost:8081}
      timeout:
        connect-ms: 3000
        read-ms: 5000



# ------------------------------------------------------------------------------
# OBSERVABILIDAD Y ACTUATOR
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ------------------------------------------------------------------------------
# DOCUMENTACIÓN DE APIS (OpenAPI / Swagger)
# ------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

# ------------------------------------------------------------------------------
# LOGGING (Nivel detallado para desarrollo)
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.logitrack.shipmentservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
