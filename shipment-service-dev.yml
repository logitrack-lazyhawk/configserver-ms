# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: shipment-service
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8080
# ==============================================================================

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          courier-service:
            connectTimeout: 2000
            readTimeout: 3000
      micrometer:
        enabled: true
  application:
    name: shipment-service

  # ----------------------------------------------------------------------------
  # PERSISTENCIA Y BASE DE DATOS (MySQL - shipment_db)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shipment_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      continue-on-error: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

# ------------------------------------------------------------------------------
# LOGGING (Nivel detallado para desarrollo)
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.logitrack.shipmentservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

#-----------------------------------------------------------------------------
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8065/eureka/}

# Micrometer Tracing + Brave + Zipkin (Spring Boot 4).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - java.lang.IllegalArgumentException
          - com.logitrack.shipmentservice.dominio.exception.ReglaNegocioException
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeoutDuration: 6s
