# ==============================================================================
# LOGITRACK - CONFIGURACIÓN CENTRALIZADA
# Servicio: security-service
# Perfil:   dev (Desarrollo local / Pruebas)
# Puerto:   8083
# ==============================================================================

server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: security-service

  # ----------------------------------------------------------------------------
  # PERSISTENCIA Y BASE DE DATOS (MySQL - security_db)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:security_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:${SECURITY_DB_PASSWORD:admin123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# PARÁMETROS DE SEGURIDAD Y TOKENS JWT
# ------------------------------------------------------------------------------
security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:${SECURITY_JWT_PRIVATE_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    expiration: ${SECURITY_JWT_EXPIRATION:3600000}
    issuer: ${SECURITY_JWT_ISSUER:logitrack-security}

# ------------------------------------------------------------------------------
# OBSERVABILIDAD Y ACTUATOR
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ------------------------------------------------------------------------------
# LOGGING (Diagnóstico para lazyHawk.security_service y Spring Security)
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    lazyHawk.security_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
